<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | EduStream</title>
    <link rel="stylesheet" href="../static/style.css">
    <style>
        .auth-container { max-width: 400px; margin: 4rem auto; position: relative; perspective: 1000px; }
        .auth-card { background: white; padding: 2.5rem; border-radius: 16px; box-shadow: var(--glass-shadow); transition: transform 0.6s ease, opacity 0.4s ease; position: absolute; width: 100%; top: 0; left: 0; backface-visibility: hidden; }
        .dark-mode .auth-card { background: #1e293b; }
        
        /* 控制面板的显示与隐藏 */
        #login-panel { z-index: 2; transform: rotateY(0deg); }
        #register-panel { z-index: 1; transform: rotateY(180deg); opacity: 0; }
        
        .flip-to-register #login-panel { transform: rotateY(-180deg); opacity: 0; z-index: 1; }
        .flip-to-register #register-panel { transform: rotateY(0deg); opacity: 1; z-index: 2; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--text-light); }
        .form-group input, .form-group select { width: 100%; padding: 0.8rem; border: 1px solid var(--glass-border); border-radius: 8px; background: var(--bg-light); color: var(--text-dark); }
        .toggle-link { color: var(--primary); cursor: pointer; font-weight: bold; text-decoration: underline; background: none; border: none; font-size: 0.9rem; padding: 0;}
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">EduStream.</a>
        <ul class="nav-links">
            <li><button onclick="toggleDarkMode()" style="background:none; border:none; font-size:1.4rem; cursor:pointer;" id="theme-icon">🌙</button></li>
            <li><a href="index.html">Home</a></li>
            <li><a href="courses.html">Courses</a></li>
            <li><a href="bookstore.html">Bookstore</a></li>
            <li><a href="portal.html" class="btn btn-primary">Sign In</a></li>
        </ul>
    </nav>

    <main class="container" style="min-height: 70vh;">
        <div style="text-align: center; margin-bottom: 2rem;" class="animate-fade-in">
            <h1 style="font-size: 2.5rem; font-weight: 900;">System <span style="color:var(--primary)">Portal</span></h1>
            <p style="color: var(--text-light);">Access your dedicated academic workspace.</p>
        </div>

        <div class="auth-container animate-fade-in delay-1" id="auth-wrapper">
            
            <!-- ================= LOGIN PANEL ================= -->
            <div class="auth-card" id="login-panel">
                <h2 style="margin-bottom: 1.5rem; text-align: center;">Sign In</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Role</label>
                        <select id="loginRole">
                            <option value="student">Student</option>
                            <option value="lecturer">Lecturer</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    <div class="form-group"><label>User ID</label><input type="text" id="loginId" required placeholder="e.g. bcs24020033"></div>
                    <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Authenticate</button>
                </form>
                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                    New to EduStream? <button class="toggle-link" onclick="toggleAuthMode()">Create an account</button>
                </div>
            </div>

            <!-- ================= REGISTER PANEL ================= -->
            <div class="auth-card" id="register-panel">
                <h2 style="margin-bottom: 1.5rem; text-align: center;">Sign Up</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label>I am a...</label>
                        <select id="regRole">
                            <option value="student">Student</option>
                            <option value="lecturer">Lecturer</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Full Name</label><input type="text" id="regName" required placeholder="e.g. John Doe"></div>
                    <div class="form-group"><label>Create User ID</label><input type="text" id="regId" required placeholder="Create a unique ID"></div>
                    <div class="form-group"><label>Create Password</label><input type="password" id="regPassword" required></div>
                    <button type="submit" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;">Create Account</button>
                </form>
                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
                    Already have an account? <button class="toggle-link" onclick="toggleAuthMode()">Sign In here</button>
                </div>
            </div>

        </div>
    </main>

    <script src="../static/app.js"></script>
    <script>
        // 简单的 UI 翻转效果
        function toggleAuthMode() {
            document.getElementById('auth-wrapper').classList.toggle('flip-to-register');
        }
    </script>
</body>
</html>
